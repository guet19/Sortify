[build]
        command = "npm run build"
        publish = "build"
[build.environment]
        # Node 24 (LTS): @zxing/library (Kamera-Scan) verlangt Node 24, nodemailer 10 mindestens Node 20
        NODE_VERSION = "24"
        # Diese Werte sind nicht geheim (Port, Benutzernamen, öffentliche Adressen) und stehen bewusst
        # in Doku und Code. Passwörter, Schlüssel und DB_URI prüft Netlify weiterhin.
        SECRETS_SCAN_OMIT_KEYS = "BASE_URL,MQTT_HOST,MQTT_PORT,MQTT_SERVER_USERNAME,MQTT_DEVICE_USERNAME"
